<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0e0f12] text-gray-100 antialiased selection:bg-indigo-500 selection:text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SDRChat — Ultra-Modern P2P Chat</title>
  
  <!-- iOS PWA Optimizations -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SDRChat">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Ably Realtime SDK -->
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            discord: {
              dark: '#0e0f12',
              server: '#1e1f22',
              sidebar: '#2b2d31',
              chat: '#313338',
              hover: '#35373c',
              accent: '#5865f2'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e1f22; }
    ::-webkit-scrollbar-thumb { background: #4e5058; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #6d6f78; }
    
    .glass-card {
      background: rgba(30, 31, 34, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Equalizer animation for voice channels */
    @keyframes eqBar {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }
    .eq-bar { animation: eqBar 1s infinite ease-in-out; }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    .eq-bar:nth-child(4) { animation-delay: 0.1s; }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-[#0e0f12] font-sans text-gray-200">

  <!-- TOP HEADER BAR -->
  <header class="h-12 border-b border-gray-800/80 bg-[#1e1f22] flex items-center justify-between px-3 shrink-0 z-30">
    <div class="flex items-center space-x-3">
      <!-- Mobile Sidebar Toggle -->
      <button onclick="toggleMobileSidebar()" class="md:hidden text-gray-400 hover:text-white p-1">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>

      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-emerald-400 flex items-center justify-center font-black text-white text-base shadow-md">
        S
      </div>
      <div>
        <h1 class="font-bold text-white text-sm flex items-center gap-2">
          SDRChat <span id="status-badge" class="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-0.5 rounded-full border border-emerald-500/30">Live Sync</span>
        </h1>
        <p id="channel-subtitle" class="text-[11px] text-gray-400">#general — SDR Central</p>
      </div>
    </div>

    <!-- Right Controls & Active Identity -->
    <div class="flex items-center space-x-3">
      <!-- Sound Toggle -->
      <button id="sound-toggle" onclick="toggleSound()" title="Toggle Audio FX" class="p-1.5 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 transition">
        <i class="fa-solid fa-volume-high text-indigo-400" id="sound-icon"></i>
      </button>

      <!-- Identity Badge -->
      <button onclick="openProfileModal()" class="flex items-center space-x-2 bg-gray-800/90 hover:bg-gray-700/80 border border-gray-700/60 rounded-full py-1 px-2.5 transition">
        <img id="header-user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" class="w-5 h-5 rounded-full bg-gray-900 border border-gray-600">
        <span id="header-user-name" class="text-xs font-semibold text-gray-200 max-w-[100px] truncate">Choose Name</span>
        <i class="fa-solid fa-gear text-[10px] text-indigo-400"></i>
      </button>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- 1. LEFT SERVER BAR -->
    <nav class="w-16 bg-[#1e1f22] border-r border-gray-800/60 flex flex-col items-center py-3 space-y-3 shrink-0 z-20">
      <!-- Server 1: SDR Central -->
      <button onclick="switchServer('sdr')" id="srv-sdr" class="relative group w-11 h-11 rounded-2xl bg-indigo-600 flex items-center justify-center text-white hover:rounded-xl transition-all duration-200 shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-bolt text-lg"></i>
        <span class="absolute left-16 bg-gray-900 text-white text-xs px-2 py-1 rounded shadow-md whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none z-50">SDR Central</span>
      </button>

      <div class="w-8 h-[2px] bg-gray-800 rounded"></div>

      <!-- Server 2: Coding Hub -->
      <button onclick="switchServer('coding')" id="srv-coding" class="relative group w-11 h-11 rounded-2xl bg-[#2b2d31] hover:bg-emerald-600 flex items-center justify-center text-gray-300 hover:text-white hover:rounded-xl transition-all duration-200">
        <i class="fa-solid fa-code text-lg"></i>
        <span class="absolute left-16 bg-gray-900 text-white text-xs px-2 py-1 rounded shadow-md whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none z-50">Coding Hub</span>
      </button>

      <!-- Server 3: Gaming Hub -->
      <button onclick="switchServer('gaming')" id="srv-gaming" class="relative group w-11 h-11 rounded-2xl bg-[#2b2d31] hover:bg-purple-600 flex items-center justify-center text-gray-300 hover:text-white hover:rounded-xl transition-all duration-200">
        <i class="fa-solid fa-gamepad text-lg"></i>
        <span class="absolute left-16 bg-gray-900 text-white text-xs px-2 py-1 rounded shadow-md whitespace-nowrap opacity-0 group-hover:opacity-100 transition pointer-events-none z-50">Gaming Hub</span>
      </button>
    </nav>

    <!-- 2. CHANNEL LISTING -->
    <aside id="channel-sidebar" class="w-60 bg-[#2b2d31] border-r border-gray-800/80 flex flex-col shrink-0 z-10 transition-transform duration-200 absolute md:relative inset-y-0 left-16 md:left-0 -translate-x-full md:translate-x-0">
      <div class="p-3 font-bold text-xs uppercase tracking-wider text-gray-400 flex justify-between items-center border-b border-gray-800/60">
        <span id="current-server-title">SDR Central</span>
        <i class="fa-solid fa-chevron-down text-[10px]"></i>
      </div>

      <div id="channel-container" class="flex-1 overflow-y-auto p-2 space-y-4">
        <!-- Dynamically rendered channels -->
      </div>

      <!-- Voice Status Box -->
      <div id="voice-status-panel" class="hidden p-3 bg-[#1e1f22] border-t border-emerald-500/30 flex flex-col space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            <span class="text-xs font-semibold text-emerald-400">Voice Connected</span>
          </div>
          <button onclick="toggleVoiceConnect()" class="text-red-400 hover:text-red-300 text-xs font-semibold">Leave</button>
        </div>
        <div class="flex items-end space-x-1 h-5 justify-center bg-[#2b2d31] rounded py-1">
          <div class="eq-bar w-1 bg-emerald-400 rounded-full"></div>
          <div class="eq-bar w-1 bg-emerald-400 rounded-full"></div>
          <div class="eq-bar w-1 bg-emerald-400 rounded-full"></div>
          <div class="eq-bar w-1 bg-emerald-400 rounded-full"></div>
        </div>
      </div>
    </aside>

    <!-- 3. MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col bg-[#313338] relative min-w-0">
      
      <!-- API Missing Warning -->
      <div id="api-warning" class="bg-amber-500/10 border-b border-amber-500/30 p-2 text-center text-xs text-amber-300 flex items-center justify-center space-x-2 hidden">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span><strong>Ably Key Needed:</strong> Replace <code>YOUR_ABLY_API_KEY_HERE</code> on line 352 for cross-network sync!</span>
      </div>

      <!-- Message History Stream -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Header welcome card -->
      </div>

      <!-- Input Box -->
      <div class="p-3 bg-[#313338] border-t border-gray-800/80">
        <form onsubmit="handleSend(event)" class="flex items-center space-x-2 bg-[#383a40] rounded-xl px-3 py-2 border border-gray-700/50 focus-within:border-indigo-500 transition">
          <button type="button" onclick="insertEmoji('🔥')" class="text-gray-400 hover:text-yellow-400 text-lg transition">
            <i class="fa-regular fa-face-smile"></i>
          </button>

          <input id="message-input" type="text" placeholder="Message #general... (Try /roll, /shrug, or code snippet)" autocomplete="off" class="flex-1 bg-transparent text-sm text-white focus:outline-none placeholder-gray-500">

          <button type="submit" class="w-9 h-9 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition shadow-md shadow-indigo-600/30 shrink-0">
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </form>
      </div>
    </main>

    <!-- 4. ACTIVE MEMBERS BAR -->
    <aside class="w-52 bg-[#2b2d31] border-l border-gray-800/80 p-3 hidden lg:block shrink-0">
      <h3 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-3">Online Peers (<span id="peer-count">1</span>)</h3>
      <div id="member-list" class="space-y-2">
        <!-- Dynamically rendered online users -->
      </div>
    </aside>

  </div>

  <!-- FIRST-TIME SETUP & PROFILE EDIT MODAL -->
  <div id="profile-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md rounded-2xl p-6 border border-gray-700 shadow-2xl">
      <div class="text-center mb-5">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-xl font-bold mx-auto mb-2 shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-user-astronaut"></i>
        </div>
        <h3 class="text-xl font-bold text-white">Choose Your Identity</h3>
        <p class="text-xs text-gray-400 mt-1">Set your display name and choose an avatar to start chatting</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Display Name</label>
          <input id="modal-name-input" type="text" maxlength="20" placeholder="e.g. AlexSDR" class="w-full bg-[#1e1f22] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Select Avatar</label>
          <div class="grid grid-cols-5 gap-2 mb-3" id="avatar-presets">
            <!-- Preset Bottts Icons -->
          </div>
          <input id="modal-avatar-input" type="text" placeholder="Or paste image URL..." class="w-full bg-[#1e1f22] border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>

        <button onclick="saveProfile()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition">
          Enter SDRChat
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    // =========================================================================
    // 🔑 REPLACE THIS KEY WITH YOUR ABLY REALTIME KEY FROM ABLY.COM
    // =========================================================================
    const ABLY_API_KEY = "P-x9Xw.2O-Uiw:mGxpHZynD8v6ZcsTSbOs1OBwntMAtW_dcTgvTB8aUos";
    // =========================================================================

    // Multi-Server Channel Definitions
    const SERVERS = {
      sdr: {
        title: "SDR Central",
        channels: [
          { id: "general", name: "general", icon: "fa-hashtag", type: "text" },
          { id: "announcements", name: "announcements", icon: "fa-bullhorn", type: "text" },
          { id: "voice-lounge", name: "Voice Lounge", icon: "fa-volume-high", type: "voice" }
        ]
      },
      coding: {
        title: "Coding Hub",
        channels: [
          { id: "general-code", name: "general-code", icon: "fa-hashtag", type: "text" },
          { id: "python-js", name: "python-js", icon: "fa-code", type: "text" },
          { id: "showcase", name: "project-showcase", icon: "fa-rocket", type: "text" }
        ]
      },
      gaming: {
        title: "Gaming Hub",
        channels: [
          { id: "lounge", name: "lounge", icon: "fa-hashtag", type: "text" },
          { id: "clip-share", name: "clip-share", icon: "fa-gamepad", type: "text" }
        ]
      }
    };

    let currentServer = "sdr";
    let currentChannel = "general";
    let ablyClient = null;
    let pubChannel = null;
    let broadcastChannel = new BroadcastChannel("sdrchat_local_sync");
    let isSoundEnabled = true;
    let isVoiceConnected = false;

    // User Profile
    let currentUser = {
      id: "usr_" + Math.random().toString(36).substring(2, 9),
      name: localStorage.getItem('sdr_username') || "",
      avatar: localStorage.getItem('sdr_avatar') || "https://api.dicebear.com/7.x/bottts/svg?seed=" + Math.floor(Math.random() * 1000)
    };

    // Preset Avatars
    const PRESETS = [
      "https://api.dicebear.com/7.x/bottts/svg?seed=Alpha",
      "https://api.dicebear.com/7.x/bottts/svg?seed=Beta",
      "https://api.dicebear.com/7.x/bottts/svg?seed=Cyber",
      "https://api.dicebear.com/7.x/bottts/svg?seed=Neon",
      "https://api.dicebear.com/7.x/bottts/svg?seed=Pixel"
    ];

    window.addEventListener('DOMContentLoaded', () => {
      renderAvatarPresets();
      
      if (!currentUser.name) {
        document.getElementById('profile-modal').classList.remove('hidden');
      } else {
        document.getElementById('profile-modal').classList.add('hidden');
        updateHeaderUI();
      }

      renderChannels();
      initMessagingEngine();

      // Listen for local tab broadcast messages
      broadcastChannel.onmessage = (event) => {
        if (event.data && event.data.channel === currentChannel) {
          displayIncomingMessage(event.data.payload);
        }
      };
    });

    function renderAvatarPresets() {
      const container = document.getElementById('avatar-presets');
      container.innerHTML = PRESETS.map(url => `
        <img src="${url}" onclick="selectPreset('${url}')" class="w-10 h-10 rounded-xl bg-[#1e1f22] border-2 border-gray-700 hover:border-indigo-500 cursor-pointer p-0.5 transition">
      `).join('');
    }

    function selectPreset(url) {
      document.getElementById('modal-avatar-input').value = url;
    }

    function updateHeaderUI() {
      document.getElementById('header-user-name').innerText = currentUser.name || "Anonymous";
      document.getElementById('header-user-avatar').src = currentUser.avatar;
    }

    function saveProfile() {
      const nameInput = document.getElementById('modal-name-input').value.trim();
      const avatarInput = document.getElementById('modal-avatar-input').value.trim();

      if (!nameInput) return alert("Please enter a display name!");

      currentUser.name = nameInput;
      if (avatarInput) currentUser.avatar = avatarInput;

      localStorage.setItem('sdr_username', currentUser.name);
      localStorage.setItem('sdr_avatar', currentUser.avatar);

      updateHeaderUI();
      document.getElementById('profile-modal').classList.add('hidden');

      if (pubChannel) {
        pubChannel.presence.update({ name: currentUser.name, avatar: currentUser.avatar });
      }
      renderMemberList();
    }

    function openProfileModal() {
      document.getElementById('modal-name-input').value = currentUser.name;
      document.getElementById('modal-avatar-input').value = currentUser.avatar;
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    // Channel & Server Switcher
    function switchServer(srvId) {
      currentServer = srvId;
      document.getElementById('current-server-title').innerText = SERVERS[srvId].title;
      
      // Update Server Button Highlight
      ['sdr', 'coding', 'gaming'].forEach(s => {
        const btn = document.getElementById(`srv-${s}`);
        if (s === srvId) {
          btn.className = "relative group w-11 h-11 rounded-xl bg-indigo-600 text-white flex items-center justify-center transition-all duration-200 shadow-lg shadow-indigo-600/30";
        } else {
          btn.className = "relative group w-11 h-11 rounded-2xl bg-[#2b2d31] hover:bg-gray-700 text-gray-300 hover:text-white transition-all duration-200";
        }
      });

      renderChannels();
      switchChannel(SERVERS[srvId].channels[0].id, SERVERS[srvId].channels[0].name);
    }

    function renderChannels() {
      const container = document.getElementById('channel-container');
      const channels = SERVERS[currentServer].channels;

      container.innerHTML = `
        <p class="px-2 text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Channels</p>
        <div class="space-y-0.5">
          ${channels.map(c => `
            <button onclick="switchChannel('${c.id}', '${c.name}', '${c.type}')" id="chan-${c.id}" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800/60 hover:text-gray-200 transition">
              <div class="flex items-center space-x-2">
                <i class="fa-solid ${c.icon}${c.type === 'voice' ? 'text-emerald-400' : 'text-gray-500'}"></i>
                <span>\${c.name}</span>
              </div>
              \${c.type === 'voice' ? '<span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1 rounded">RTC</span>' : ''}
            </button>
          `).join('')}
        </div>
      `;
    }

    function switchChannel(id, name, type = 'text') {
      if (type === 'voice') {
        toggleVoiceConnect();
        return;
      }

      currentChannel = id;
      document.getElementById('channel-subtitle').innerText = `#${name} — ${SERVERS[currentServer].title}`;
      
      // Highlight active channel
      SERVERS[currentServer].channels.forEach(c => {
        const btn = document.getElementById(`chan-${c.id}`);
        if (btn) {
          if (c.id === id) {
            btn.className = "w-full flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-sm bg-gray-800 text-white font-medium";
          } else {
            btn.className = "w-full flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-sm text-gray-400 hover:bg-gray-800/60 hover:text-gray-200";
          }
        }
      });

      // Clear & set header
      const msgBox = document.getElementById('chat-messages');
      msgBox.innerHTML = `
        <div class="border-b border-gray-800 pb-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-lg font-bold mb-2">#</div>
          <h2 class="text-xl font-bold text-white">Welcome to #${name}!</h2>
          <p class="text-xs text-gray-400">Start of the real-time conversation.</p>
        </div>
      `;

      connectToAblyChannel();
    }

    // Messaging Engine
    function initMessagingEngine() {
      if (!ABLY_API_KEY || ABLY_API_KEY === "YOUR_ABLY_API_KEY_HERE") {
        document.getElementById('api-warning').classList.remove('hidden');
        renderMemberList();
        return;
      }

      try {
        ablyClient = new Ably.Realtime({ key: ABLY_API_KEY, clientId: currentUser.id });
        ablyClient.connection.on('connected', () => {
          document.getElementById('status-badge').innerText = "Live Connected";
          connectToAblyChannel();
        });
      } catch (err) {
        console.error("Ably Init Error:", err);
      }
    }

    function connectToAblyChannel() {
      if (!ablyClient) return;

      if (pubChannel) pubChannel.unsubscribe();

      pubChannel = ablyClient.channels.get(`sdrchat-${currentServer}-${currentChannel}`);
      
      pubChannel.subscribe('chat-msg', (msg) => {
        displayIncomingMessage(msg.data);
        if (msg.data.user.id !== currentUser.id) playAudioFx('receive');
      });

      pubChannel.presence.enter({ name: currentUser.name, avatar: currentUser.avatar });
      pubChannel.presence.subscribe(() => updatePresenceMembers());
    }

    function updatePresenceMembers() {
      if (!pubChannel) return;
      pubChannel.presence.get((err, members) => {
        if (err) return;
        const list = document.getElementById('member-list');
        list.innerHTML = '';
        document.getElementById('peer-count').innerText = members.length || 1;
        members.forEach(m => {
          const d = m.data || {};
          renderMemberBadge(d.name || "Peer", d.avatar || "https://api.dicebear.com/7.x/bottts/svg?seed=Guest");
        });
      });
    }

    function renderMemberList() {
      const list = document.getElementById('member-list');
      list.innerHTML = '';
      renderMemberBadge(currentUser.name || "You", currentUser.avatar);
    }

    function renderMemberBadge(name, avatar) {
      const list = document.getElementById('member-list');
      list.innerHTML += `
        <div class="flex items-center space-x-2 px-2 py-1.5 rounded-lg bg-[#1e1f22] border border-gray-800">
          <div class="relative">
            <img src="${avatar}" class="w-6 h-6 rounded-full border border-gray-700 bg-gray-800">
            <span class="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 border border-gray-950"></span>
          </div>
          <span class="text-xs font-semibold text-gray-300 truncate">${name}</span>
        </div>
      `;
    }

    function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      if (text.startsWith('/')) {
        handleSlashCommand(text);
        input.value = '';
        return;
      }

      const payload = {
        user: currentUser,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      // Broadcast to local tabs
      broadcastChannel.postMessage({ channel: currentChannel, payload: payload });

      if (pubChannel) {
        pubChannel.publish('chat-msg', payload);
      } else {
        displayIncomingMessage(payload);
      }

      playAudioFx('send');
      input.value = '';
    }

    function displayIncomingMessage(payload) {
      const container = document.getElementById('chat-messages');
      const isCode = payload.text.startsWith('```') && payload.text.endsWith('```');
      const cleanText = isCode ? payload.text.slice(3, -3) : payload.text;

      const html = `
        <div class="flex items-start space-x-3 group">
          <img src="${payload.user.avatar}" class="w-9 h-9 rounded-full border border-gray-700 bg-gray-800 shrink-0">
          <div class="flex-1 overflow-hidden">
            <div class="flex items-center space-x-2">
              <span class="font-bold text-xs text-indigo-400">${payload.user.name}</span>
              <span class="text-[10px] text-gray-500">${payload.time}</span>
            </div>
            ${isCode 
              ? `<pre class="bg-gray-950 p-3 rounded-lg text-xs font-mono text-emerald-400 overflow-x-auto border border-gray-800 mt-1">\${escapeHTML(cleanText)}</pre>`
              : `<p class="text-sm text-gray-200 mt-0.5 whitespace-pre-wrap">\${escapeHTML(cleanText)}</p>`
            }
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', html);
      container.scrollTop = container.scrollHeight;
    }

    function handleSlashCommand(cmd) {
      let text = "";
      if (cmd === '/shrug') text = "¯\\_(ツ)_/¯";
      else if (cmd === '/roll') text = `🎲 Rolled: **${Math.floor(Math.random() * 100) + 1}**`;
      else if (cmd === '/clear') { document.getElementById('chat-messages').innerHTML = ''; return; }
      else text = "Commands: `/shrug`, `/roll`, `/clear`";

      displayIncomingMessage({
        user: { name: "SDRBot", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=SDRBot" },
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
    }

    function toggleVoiceConnect() {
      isVoiceConnected = !isVoiceConnected;
      const panel = document.getElementById('voice-status-panel');
      panel.classList.toggle('hidden', !isVoiceConnected);
      playAudioFx(isVoiceConnected ? 'send' : 'receive');
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('channel-sidebar');
      sidebar.classList.toggle('-translate-x-full');
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      document.getElementById('sound-icon').className = isSoundEnabled ? "fa-solid fa-volume-high text-indigo-400" : "fa-solid fa-volume-xmark text-gray-500";
    }

    function playAudioFx(type) {
      if (!isSoundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(type === 'send' ? 440 : 600, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    function insertEmoji(e) {
      const input = document.getElementById('message-input');
      input.value += e;
      input.focus();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
